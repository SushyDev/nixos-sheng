services:
  builder:
    build: .
    container_name: sheng-nix-builder
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      # Named volume, so the store survives container rebuilds. Without it
      # every build re-downloads the whole closure, kernel included.
      - nix-store:/nix
      - ./authorized_keys:/root/.ssh/authorized_keys:ro
    restart: unless-stopped

volumes:
  nix-store:

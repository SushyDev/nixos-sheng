services:
  builder:
    image: sheng-builder:latest
    build: .
    container_name: sheng-builder

    # No ports: everything goes over `docker exec`, so there is no sshd or
    # host-key trust to manage.
    volumes:
      # Named volume, or `docker rm` destroys the store and the next build
      # recompiles the kernel, which is in no binary cache.
      - nix-store:/nix
      - ../:/workspace:ro
    restart: unless-stopped

volumes:
  nix-store:

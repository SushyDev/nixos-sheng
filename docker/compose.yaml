services:
  builder:
    image: sheng-builder:latest
    build: .
    container_name: sheng-builder

    # No ports: everything goes over `docker exec`, so there is no sshd or
    # host-key trust to manage.
    volumes:
      - nix-store:/nix
      # The whole workspace, at the host's own path, so --override-input
      # ../u-boot resolves the same inside as out.
      - ${SHENG_WORKSPACE:?set by the builder script}:${SHENG_WORKSPACE}:ro
    restart: unless-stopped

volumes:
  # Named explicitly so the kernel build cached in it survives the compose
  # project being renamed. `docker rm` of the container does not touch it.
  nix-store:
    name: docker_nix-store
